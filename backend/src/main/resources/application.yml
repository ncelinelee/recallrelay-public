server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: recallrelay-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/recallrelay}
    username: ${DB_USERNAME:recallrelay}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@recallrelay.local}
    dev-expose-secrets: ${MAIL_DEV_EXPOSE_SECRETS:false}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${RECALLRELAY_JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}

logging:
  level:
    org.springframework.security: INFO
